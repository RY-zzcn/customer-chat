name: 部署 Demo 到 GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'demo/**'

# 授予 GitHub Pages 写入权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同时只有一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Pages
        uses: actions/configure-pages@v4

      - name: 上传 Demo 页面
        uses: actions/upload-pages-artifact@v3
        with:
          path: './demo'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
