<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客服管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
    }

    /* 侧边栏 */
    .sidebar {
      width: 320px;
      background: #fff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .sidebar-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .sidebar-header h2 {
      font-size: 17px;
      margin-bottom: 4px;
    }
    .sidebar-header .status {
      font-size: 12px;
      opacity: 0.85;
    }
    .btn-logout {
      padding: 4px 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.35); }
    .sidebar-nav {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
    }
    .sidebar-nav button {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .sidebar-nav button.active {
      color: #667eea;
      border-bottom-color: #667eea;
      font-weight: 500;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
    }
    .conversation-list::-webkit-scrollbar { width: 4px; }
    .conversation-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .conv-item {
      padding: 14px 20px;
      border-bottom: 1px solid #f9fafb;
      cursor: pointer;
      transition: background 0.15s;
    }
    .conv-item:hover { background: #f9fafb; }
    .conv-item.active { background: #f5f3ff; border-left: 3px solid #667eea; }
    .conv-item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .conv-item .name {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }
    .conv-item .badge {
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
      display: none;
    }
    .conv-item .badge.show { display: inline-block; }
    .conv-item .preview {
      font-size: 12px;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conv-item .time {
      font-size: 11px;
      color: #d1d5db;
      margin-top: 4px;
    }
    .conv-search {
      padding: 8px 12px;
      margin: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      font-family: inherit;
      width: calc(100% - 24px);
      box-sizing: border-box;
    }
    .conv-search:focus { border-color: #667eea; }
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

    /* 主区域 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .main-header {
      padding: 12px 24px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-header h3 { font-size: 15px; color: #374151; }
    .main-header .actions {
      display: flex;
      gap: 8px;
    }
    .main-header .actions button {
      padding: 6px 14px;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      color: #6b7280;
      transition: all 0.2s;
    }
    .main-header .actions button:hover {
      border-color: #667eea;
      color: #667eea;
    }
    .main-header .actions button.danger {
      color: #ef4444;
      border-color: #fecaca;
    }
    .main-header .actions button.danger:hover {
      background: #fef2f2;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .msg {
      max-width: 70%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.visitor { align-self: flex-start; }
    .msg.admin { align-self: flex-end; }
    .msg.bot, .msg.system { align-self: flex-start; }

    .msg .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .msg.visitor .bubble { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .msg.admin .bubble { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
    .msg.bot .bubble { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .msg.system .bubble { background: transparent; color: #9ca3af; font-size: 12px; text-align: center; }

    .msg .meta {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 3px;
    }
    .msg .timestamp {
      font-size: 11px;
      color: #d1d5db;
      margin-top: 3px;
    }
    .msg.admin .timestamp { text-align: right; }

    .chat-input {
      padding: 12px 24px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .chat-input textarea {
      flex: 1;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      min-height: 40px;
      max-height: 100px;
      line-height: 1.5;
    }
    .chat-input textarea:focus { border-color: #667eea; }
    .chat-input button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      white-space: nowrap;
    }
    .chat-input button:hover { opacity: 0.9; }

    .no-chat-selected {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #9ca3af;
    }
    .no-chat-selected .icon { font-size: 48px; margin-bottom: 12px; }

    /* 知识库面板 */
    .knowledge-panel {
      display: none;
      padding: 20px 24px;
      flex: 1;
      overflow-y: auto;
    }
    .knowledge-panel.show { display: block; }
    .knowledge-panel h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #374151;
    }
    .kb-add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .kb-add-form input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .kb-add-form input:focus { border-color: #667eea; }
    .kb-add-form button {
      padding: 8px 16px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      white-space: nowrap;
    }
    .kb-item {
      padding: 12px 16px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .kb-item .kb-content { flex: 1; }
    .kb-item .kb-keywords {
      font-size: 12px;
      color: #667eea;
      margin-bottom: 4px;
    }
    .kb-item .kb-reply {
      font-size: 14px;
      color: #374151;
    }
    .kb-item .kb-actions button {
      padding: 4px 10px;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #6b7280;
    }
    .kb-item .kb-actions button:hover { border-color: #ef4444; color: #ef4444; }

    /* 设置面板 */
    .settings-panel {
      display: none;
      padding: 20px 24px;
      flex: 1;
      overflow-y: auto;
    }
    .settings-panel.show { display: block; }
    .settings-panel h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #374151;
    }
    .settings-section {
      background: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .settings-section h4 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #374151;
    }
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .form-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .form-row input:focus { border-color: #667eea; }
    .settings-section button {
      padding: 8px 16px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    .settings-section .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
      color: #6b7280;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.on { background: #22c55e; }
    .status-dot.off { background: #d1d5db; }

    .load-more-btn {
      display: block;
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #6b7280;
      font-family: inherit;
      transition: all .2s;
      order: -1;
    }
    .load-more-btn:hover { background: #e5e7eb; color: #374151; }
    .load-more-btn:disabled { opacity: .5; cursor: not-allowed; }

    .chat-area { overflow-anchor: none; }
    .chat-anchor { overflow-anchor: auto; height: 1px; }
  </style>
</head>
<body>
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div>
        <h2>💬 客服管理后台</h2>
        <div class="status" id="sidebarStatus">管理员在线</div>
      </div>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </div>
    <div class="sidebar-nav">
      <button class="active" onclick="switchTab('chat')">会话列表</button>
      <button onclick="switchTab('knowledge')">知识库</button>
      <button onclick="switchTab('settings')">设置</button>
    </div>
    <input type="text" class="conv-search" id="convSearch" placeholder="🔍 搜索会话..." oninput="filterConversations()">
    <div class="conversation-list" id="conversationList">
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>暂无活跃会话</p>
      </div>
    </div>
  </div>

  <!-- 主区域 -->
  <div class="main">
    <!-- 聊天视图 -->
    <div class="main-header" id="chatHeader">
      <h3 id="chatTitle">选择一个会话开始回复</h3>
      <div class="actions">
        <button onclick="closeCurrentConversation()" class="danger">关闭会话</button>
      </div>
    </div>
    <div class="chat-area" id="chatMessages">
      <div class="no-chat-selected">
        <div class="icon">💬</div>
        <p>请从左侧选择一个会话</p>
      </div>
    </div>
    <div class="chat-input" id="chatInput">
      <textarea id="adminInput" placeholder="输入回复内容... (Ctrl+Enter 发送)" onkeydown="handleAdminKey(event)"></textarea>
      <button onclick="sendAdminMessage()">发送</button>
    </div>

    <!-- 知识库视图 -->
    <div class="knowledge-panel" id="knowledgePanel">
      <h3>📚 知识库管理</h3>
      <p style="font-size:13px;color:#9ca3af;margin-bottom:16px">设置关键词自动回复，多个关键词用英文逗号分隔</p>
      <div class="kb-add-form">
        <input type="text" id="kbKeywords" placeholder="关键词（如: 你好,您好,hi）" style="max-width:200px">
        <input type="text" id="kbReply" placeholder="回复内容">
        <button onclick="addKnowledge()">添加</button>
      </div>
      <div id="knowledgeList"></div>
    </div>

    <!-- 设置视图 -->
    <div class="settings-panel" id="settingsPanel">
      <h3>⚙️ 系统设置</h3>

      <div class="settings-section">
        <h4>🏪 基础信息配置</h4>
        <p style="font-size:12px;color:#9ca3af;margin-bottom:12px">以下信息将展示在顾客聊天页面，配置后即时生效</p>
        <div class="form-row" style="flex-direction:column;gap:10px">
          <input type="text" id="settingSiteName" placeholder="站点名称（如：XX流量卡在线客服）">
          <input type="email" id="settingContactEmail" placeholder="联系邮箱（访客可看到此邮箱）">
          <input type="text" id="settingWelcomeMessage" placeholder="欢迎消息（访客首次打开聊天窗口时显示）">
          <input type="text" id="settingWorkingHours" placeholder="工作时间（如：9:00-21:00）">
        </div>
        <button onclick="saveSystemSettings()">💾 保存设置</button>
      </div>

      <div class="settings-section">
        <h4>📧 邮件通知配置</h4>
        <p style="font-size:12px;color:#9ca3af;margin-bottom:12px">配置 SMTP 邮件服务，有访客消息时将自动通知管理员（仅无人在线时发送）</p>
        <div class="form-row" style="align-items:center;margin-bottom:12px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-family:inherit">
            <input type="checkbox" id="mailEnabled" onchange="toggleMailForm()"> 启用邮件通知
          </label>
          <button onclick="saveMailSettings()" style="margin-left:auto">💾 保存邮件配置</button>
        </div>
        <div id="mailFormFields" style="display:none">
          <div class="form-row" style="flex-wrap:wrap;gap:8px;margin-bottom:8px">
            <input type="text" id="mailSmtpHost" placeholder="SMTP 服务器" style="flex:2;min-width:150px">
            <input type="number" id="mailSmtpPort" placeholder="端口" style="flex:1;min-width:80px">
            <select id="mailSmtpSecure" style="flex:1;min-width:80px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;font-family:inherit;outline:none">
              <option value="true">SSL/TLS</option>
              <option value="false">无加密</option>
            </select>
          </div>
          <div class="form-row" style="gap:8px;margin-bottom:8px">
            <input type="text" id="mailSmtpUser" placeholder="邮箱账号" style="flex:1">
            <input type="password" id="mailSmtpPass" placeholder="SMTP 授权码" style="flex:1">
          </div>
          <div class="form-row" style="gap:8px;margin-bottom:8px">
            <input type="email" id="mailNotifyEmail" placeholder="通知接收邮箱" style="flex:1">
          </div>
          <button onclick="testEmail()" id="testEmailBtn">📬 发送测试邮件</button>
          <span id="mailTestResult" style="font-size:12px;margin-left:10px"></span>
        </div>
      </div>

      <div class="settings-section">
        <h4>🤖 AI 机器人配置</h4>
        <p style="font-size:12px;color:#9ca3af;margin-bottom:12px">接入 DeepSeek / OpenAI 等大模型，无人值守时自动回复访客消息</p>
        <div class="form-row" style="align-items:center;margin-bottom:12px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-family:inherit">
            <input type="checkbox" id="aiEnabled" onchange="toggleAIForm()"> 启用 AI 机器人
          </label>
          <button onclick="saveAISettings()" style="margin-left:auto">💾 保存 AI 配置</button>
        </div>
        <div id="aiFormFields" style="display:none">
          <div class="form-row" style="gap:8px;margin-bottom:8px">
            <input type="text" id="aiProvider" placeholder="平台名称（如：deepseek）" style="flex:1">
            <input type="text" id="aiModel" placeholder="模型名称（如：deepseek-chat）" style="flex:1">
          </div>
          <div class="form-row" style="flex-direction:column;gap:8px;margin-bottom:8px">
            <input type="text" id="aiApiUrl" placeholder="API 地址（如：https://api.deepseek.com/v1/chat/completions）">
            <input type="password" id="aiApiKey" placeholder="API Key">
          </div>
          <span id="aiSaveResult" style="font-size:12px"></span>
        </div>
      </div>

      <div class="settings-section">
        <h4>🔑 修改管理员密码</h4>
        <div class="form-row">
          <input type="password" id="oldPassword" placeholder="原密码">
          <input type="password" id="newPassword" placeholder="新密码（6-128位）">
          <button onclick="changePassword()">修改</button>
        </div>
      </div>

      <div class="settings-section">
        <h4>📊 顾客端地址</h4>
        <p style="font-size:13px;color:#6b7280">
          顾客聊天页面地址：<code id="visitorUrl" style="background:#e5e7eb;padding:2px 6px;border-radius:4px"></code>
          <br><br>将此链接生成二维码，顾客扫码即可进入聊天页面。
        </p>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let activeConversationId = null;
    let currentTab = 'chat';
    let allConversations = []; // 缓存全部会话用于搜索
    let messageOffset = 0;
    let messageTotal = 0;
    const MESSAGE_PAGE_SIZE = 50;

    // 恢复上次会话
    const savedConvId = sessionStorage.getItem('activeConversationId');
    if (savedConvId) activeConversationId = savedConvId;

    // 管理员加入
    socket.emit('admin:join');

    async function logout() {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
      } catch (e) {}
      sessionStorage.removeItem('activeConversationId');
      window.location.href = '/admin/login.html';
    }

    socket.on('admin:init', (conversations) => {
      allConversations = conversations;
      renderConversationList(conversations);

      // 恢复上次打开的会话
      const savedId = sessionStorage.getItem('activeConversationId');
      if (savedId && conversations.some(c => c.id === savedId)) {
        activeConversationId = savedId;
        selectConversation(savedId);
      }
    });

    socket.on('admin:visitor-joined', (conv) => {
      allConversations.unshift(conv);
      addConversationItem(conv);
    });

    socket.on('admin:new-message', (msg) => {
      updateConversationInList(msg.conversation_id);
      if (activeConversationId === msg.conversation_id) {
        appendChatMessage(msg);
        scrollChatBottomIfNeeded();
      }
    });

    socket.on('admin:conversation-update', (conv) => {
      const idx = allConversations.findIndex(c => c.id === conv.id);
      if (idx >= 0) allConversations[idx] = conv;
      updateConversationInList(conv.id);
    });

    socket.on('admin:conversation-data', (data) => {
      messageOffset = data.messages ? data.messages.length : 0;
      messageTotal = data.total || 0;
      renderChatMessages(data.messages, data.hasMore);
    });

    socket.on('admin:message-sent', (msg) => {
      appendChatMessage(msg);
      scrollChatBottom();
    });

    // 访客正在输入提示
    socket.on('admin:typing', (data) => {
      const title = document.getElementById('chatTitle');
      if (data.conversationId === activeConversationId) {
        if (data.typing) {
          title.textContent += ' ...正在输入';
          title.style.color = '#667eea';
        } else {
          const name = title.textContent.replace(' ...正在输入', '');
          title.textContent = name;
          title.style.color = '#374151';
        }
      }
    });

    // ===== 会话列表 =====
    function renderConversationList(conversations) {
      const el = document.getElementById('conversationList');
      if (!conversations || conversations.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无活跃会话</p></div>';
        return;
      }
      el.innerHTML = conversations.map(c => convItemHTML(c)).join('');

      // 给已选的加 active
      if (activeConversationId) {
        const active = el.querySelector(`[data-id="${activeConversationId}"]`);
        if (active) active.classList.add('active');
      }
    }

    function convItemHTML(c) {
      const unread = c.unread_count > 0 ? `<span class="badge show">${c.unread_count}</span>` : '<span class="badge">0</span>';
      const time = formatTime(c.updated_at);
      return `
        <div class="conv-item" data-id="${c.id}" onclick="selectConversation('${c.id}')">
          <div class="top">
            <span class="name">${escHtml(c.visitor_name)}</span>
            ${unread}
          </div>
          <div class="time">${time}</div>
        </div>`;
    }

    function addConversationItem(c) {
      const el = document.getElementById('conversationList');
      const empty = el.querySelector('.empty-state');
      if (empty) el.innerHTML = '';
      el.insertAdjacentHTML('afterbegin', convItemHTML(c));
    }

    function updateConversationInList(id) {
      fetch(`/api/conversations/${id}`)
        .then(r => r.json())
        .then(data => {
          const item = document.querySelector(`.conv-item[data-id="${id}"]`);
          if (item && data.conversation) {
            const c = data.conversation;
            item.querySelector('.name').textContent = c.visitor_name;
            const badge = item.querySelector('.badge');
            if (c.unread_count > 0) {
              badge.textContent = c.unread_count;
              badge.classList.add('show');
            } else {
              badge.classList.remove('show');
            }
            item.querySelector('.time').textContent = formatTime(c.updated_at);
          }
        });
    }

    function updateConversationBadge(id) {
      updateConversationInList(id);
    }

    // 会话搜索/筛选
    function filterConversations() {
      const query = document.getElementById('convSearch').value.toLowerCase();
      if (!query) {
        renderConversationList(allConversations);
        return;
      }
      const filtered = allConversations.filter(c =>
        (c.visitor_name || '').toLowerCase().includes(query) ||
        (c.id || '').toLowerCase().includes(query)
      );
      renderConversationList(filtered);
    }

    async function selectConversation(id) {
      activeConversationId = id;
      messageOffset = 0;
      messageTotal = 0;
      sessionStorage.setItem('activeConversationId', id);

      // 更新列表高亮
      document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
      const item = document.querySelector(`.conv-item[data-id="${id}"]`);
      if (item) {
        item.classList.add('active');
        const badge = item.querySelector('.badge');
        badge.classList.remove('show');
      }

      document.getElementById('chatTitle').textContent =
        '正在回复：' + (item ? item.querySelector('.name').textContent : '访客');

      // 清除 no-chat-selected
      const noChat = document.querySelector('.no-chat-selected');
      if (noChat) noChat.remove();

      socket.emit('admin:select-conversation', { conversationId: id });
    }

    function closeCurrentConversation() {
      if (!activeConversationId) return;
      if (!confirm('确定关闭此会话吗？')) return;

      fetch(`/api/conversations/${activeConversationId}/close`, { method: 'PUT' })
        .then(r => r.json())
        .then(() => {
          const item = document.querySelector(`.conv-item[data-id="${activeConversationId}"]`);
          if (item) item.remove();
          allConversations = allConversations.filter(c => c.id !== activeConversationId);
          activeConversationId = null;
          sessionStorage.removeItem('activeConversationId');
          document.getElementById('chatTitle').textContent = '选择一个会话开始回复';
          document.getElementById('chatMessages').innerHTML = `
            <div class="no-chat-selected"><div class="icon">💬</div><p>请从左侧选择一个会话</p></div>`;
        });
    }

    // ===== 聊天消息 =====
    function renderChatMessages(messages, hasMore) {
      const el = document.getElementById('chatMessages');
      const noChat = el.querySelector('.no-chat-selected');
      if (noChat) noChat.remove();

      // 如果有更多历史消息，先渲染"加载更多"按钮
      let html = '';
      if (hasMore) {
        html += `<button class="load-more-btn" onclick="loadMoreMessages()">📜 加载更多历史消息</button>`;
      }
      html += messages.map(m => msgHTML(m)).join('');
      // 滚动锚点
      html += '<div class="chat-anchor"></div>';
      el.innerHTML = html;
      scrollChatBottom();
    }

    // 加载更多历史消息
    async function loadMoreMessages() {
      if (!activeConversationId) return;
      const btn = document.querySelector('.load-more-btn');
      if (btn) { btn.disabled = true; btn.textContent = '加载中...'; }

      try {
        const res = await fetch(`/api/conversations/${activeConversationId}?limit=${MESSAGE_PAGE_SIZE}&offset=${messageOffset}`);
        const data = await res.json();
        if (data.messages && data.messages.length > 0) {
          // 在现有消息之前插入
          const el = document.getElementById('chatMessages');
          const anchor = el.querySelector('.chat-anchor');
          const anchorBefore = el.querySelector('.load-more-btn') || el.firstChild;

          // 移除旧的 load-more 按钮
          const oldBtn = el.querySelector('.load-more-btn');
          if (oldBtn) oldBtn.remove();

          // 如果有更多，重新添加 load-more
          let prependHtml = '';
          if (data.hasMore) {
            prependHtml += `<button class="load-more-btn" onclick="loadMoreMessages()">📜 加载更多历史消息</button>`;
          }
          prependHtml += data.messages.map(m => msgHTML(m)).join('');

          el.insertAdjacentHTML('afterbegin', prependHtml);
          messageOffset += data.messages.length;
          messageTotal = data.total;
        }
      } catch (err) {
        console.error('加载更多消息失败:', err);
      }
      if (btn) { btn.disabled = false; btn.textContent = '📜 加载更多历史消息'; }
    }

    function appendChatMessage(msg) {
      const el = document.getElementById('chatMessages');
      const noChat = el.querySelector('.no-chat-selected');
      if (noChat) noChat.remove();
      // 移除滚动锚点，添加消息，再添加锚点
      const anchor = el.querySelector('.chat-anchor');
      if (anchor) anchor.remove();
      el.insertAdjacentHTML('beforeend', msgHTML(msg) + '<div class="chat-anchor"></div>');
    }

    function msgHTML(m) {
      const time = new Date(m.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const name = m.sender_type === 'bot' ? '🤖 ' + (m.sender_name || 'AI') :
                    m.sender_type === 'admin' ? '💁 ' + (m.sender_name || '客服') :
                    '👤 ' + (m.sender_name || '访客');
      return `
        <div class="msg ${m.sender_type}">
          <div class="meta">${name}</div>
          <div class="bubble">${escHtml(m.content).replace(/\n/g, '<br>')}</div>
          <div class="timestamp">${time}</div>
        </div>`;
    }

    function sendAdminMessage() {
      if (!activeConversationId) return alert('请先选择一个会话');
      const input = document.getElementById('adminInput');
      const content = input.value.trim();
      if (!content) return;

      socket.emit('admin:message', { content });
      input.value = '';
      input.style.height = 'auto';
      input.focus();
    }

    function handleAdminKey(e) {
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        sendAdminMessage();
      }
    }

    // 管理员打字提示
    let adminTypingTimer = null;
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('adminInput');
      if (input) {
        input.addEventListener('input', () => {
          socket.emit('admin:typing', { typing: input.value.length > 0 });
          clearTimeout(adminTypingTimer);
          adminTypingTimer = setTimeout(() => {
            socket.emit('admin:typing', { typing: false });
          }, 2000);
        });
      }
    });

    function scrollChatBottom() {
      const el = document.getElementById('chatMessages');
      el.scrollTop = el.scrollHeight;
    }

    // 管理端自动滚动（仅在用户已在底部时）
    document.getElementById('chatMessages').addEventListener('scroll', function() {
      const el = this;
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 50;
      el.dataset.atBottom = atBottom ? '1' : '0';
    });

    function scrollChatBottomIfNeeded() {
      const el = document.getElementById('chatMessages');
      if (el.dataset.atBottom === '1') {
        el.scrollTop = el.scrollHeight;
      }
    }

    // ===== Tab 切换 =====
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.sidebar-nav button').forEach((b, i) => {
        b.classList.toggle('active', ['chat', 'knowledge', 'settings'][i] === tab);
      });

      document.getElementById('chatHeader').style.display = tab === 'chat' ? 'flex' : 'none';
      document.getElementById('chatMessages').style.display = tab === 'chat' ? 'flex' : 'none';
      document.getElementById('chatInput').style.display = tab === 'chat' ? 'flex' : 'none';
      document.getElementById('knowledgePanel').classList.toggle('show', tab === 'knowledge');
      document.getElementById('settingsPanel').classList.toggle('show', tab === 'settings');

      if (tab === 'knowledge') loadKnowledge();
      if (tab === 'settings') loadSettings();
    }

    // ===== 知识库 =====
    function loadKnowledge() {
      fetch('/api/knowledge')
        .then(r => r.json())
        .then(items => {
          const el = document.getElementById('knowledgeList');
          el.innerHTML = items.map(k => `
            <div class="kb-item">
              <div class="kb-content">
                <div class="kb-keywords">关键词: ${escHtml(k.keywords)}</div>
                <div class="kb-reply">回复: ${escHtml(k.reply)}</div>
              </div>
              <div class="kb-actions">
                <button onclick="deleteKnowledge(${k.id})">删除</button>
              </div>
            </div>
          `).join('');
        });
    }

    function addKnowledge() {
      const keywords = document.getElementById('kbKeywords').value.trim();
      const reply = document.getElementById('kbReply').value.trim();
      if (!keywords || !reply) return alert('请填写关键词和回复内容');

      fetch('/api/knowledge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keywords, reply }),
      })
        .then(r => r.json())
        .then(() => {
          document.getElementById('kbKeywords').value = '';
          document.getElementById('kbReply').value = '';
          loadKnowledge();
        });
    }

    function deleteKnowledge(id) {
      if (!confirm('确定删除此知识库条目？')) return;
      fetch(`/api/knowledge/${id}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(() => loadKnowledge());
    }

    // ===== 设置 =====
    async function loadSettings() {
      try {
        document.getElementById('visitorUrl').textContent = window.location.origin;
        loadSystemSettings();
        loadMailSettings();
        loadAISettings();
      } catch (err) {
        console.error('加载设置失败:', err);
      }
    }

    async function loadSystemSettings() {
      try {
        const res = await fetch('/api/admin/settings');
        const data = await res.json();
        document.getElementById('settingSiteName').value = data.siteName || '';
        document.getElementById('settingContactEmail').value = data.contactEmail || '';
        document.getElementById('settingWelcomeMessage').value = data.welcomeMessage || '';
        document.getElementById('settingWorkingHours').value = data.workingHours || '';
      } catch (err) {
        console.error('加载系统设置失败:', err);
      }
    }

    async function saveSystemSettings() {
      const data = {
        siteName: document.getElementById('settingSiteName').value.trim(),
        contactEmail: document.getElementById('settingContactEmail').value.trim(),
        welcomeMessage: document.getElementById('settingWelcomeMessage').value.trim(),
        workingHours: document.getElementById('settingWorkingHours').value.trim(),
      };

      try {
        const res = await fetch('/api/admin/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        alert(result.success ? '系统设置已保存！' : '保存失败：' + (result.error || '未知错误'));
      } catch (err) {
        alert('请求失败：' + err.message);
      }
    }

    // ===== 邮件配置 =====
    async function loadMailSettings() {
      try {
        const res = await fetch('/api/admin/mail-settings');
        const cfg = await res.json();
        document.getElementById('mailEnabled').checked = cfg.enabled === true || cfg.enabled === 'true';
        document.getElementById('mailSmtpHost').value = cfg.host || '';
        document.getElementById('mailSmtpPort').value = cfg.port || '';
        document.getElementById('mailSmtpSecure').value = cfg.secure ? 'true' : 'false';
        document.getElementById('mailSmtpUser').value = cfg.user || '';
        document.getElementById('mailSmtpPass').value = cfg.passConfigured ? '••••••' : '';
        document.getElementById('mailNotifyEmail').value = cfg.notifyEmail || '';
        toggleMailForm();
      } catch (err) {
        console.error('加载邮件配置失败:', err);
      }
    }

    function toggleMailForm() {
      const checked = document.getElementById('mailEnabled').checked;
      document.getElementById('mailFormFields').style.display = checked ? 'block' : 'none';
    }

    async function saveMailSettings() {
      const enabled = document.getElementById('mailEnabled').checked;
      const host = document.getElementById('mailSmtpHost').value.trim();
      const port = document.getElementById('mailSmtpPort').value;
      const secure = document.getElementById('mailSmtpSecure').value;
      const user = document.getElementById('mailSmtpUser').value.trim();
      const pass = document.getElementById('mailSmtpPass').value;
      const notifyEmail = document.getElementById('mailNotifyEmail').value.trim();

      if (enabled) {
        if (!host) return alert('请填写 SMTP 服务器地址');
        if (!user) return alert('请填写邮箱账号');
        if (!pass || pass === '••••••') {
          // 如果密码是占位符，不传密码字段（保留原密码）
        }
      }

      try {
        const res = await fetch('/api/admin/mail-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled, host, port, secure, user, pass, notifyEmail }),
        });
        const result = await res.json();
        if (result.success) {
          alert('邮件配置已保存并' + (result.active ? '启用' : '更新') + '！');
          // 保存成功后密码字段显示占位符
          if (pass && pass !== '••••••') {
            document.getElementById('mailSmtpPass').value = '••••••';
          }
        } else {
          alert('保存失败：' + (result.error || '未知错误'));
        }
      } catch (err) {
        alert('请求失败：' + err.message);
      }
    }

    async function testEmail() {
      const btn = document.getElementById('testEmailBtn');
      const resultEl = document.getElementById('mailTestResult');
      btn.disabled = true;
      btn.textContent = '发送中...';
      resultEl.textContent = '';
      try {
        const res = await fetch('/api/admin/test-email', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          resultEl.textContent = '✅ 发送成功！请检查收件箱';
          resultEl.style.color = '#22c55e';
        } else {
          resultEl.textContent = '❌ 发送失败：' + (data.error || '未知错误');
          resultEl.style.color = '#ef4444';
        }
      } catch (err) {
        resultEl.textContent = '❌ 请求失败：' + err.message;
        resultEl.style.color = '#ef4444';
      }
      btn.disabled = false;
      btn.textContent = '📬 发送测试邮件';
    }

    // ===== AI 配置 =====
    async function loadAISettings() {
      try {
        const res = await fetch('/api/admin/ai-settings');
        const cfg = await res.json();
        document.getElementById('aiEnabled').checked = cfg.enabled === true || cfg.enabled === 'true';
        document.getElementById('aiProvider').value = cfg.provider || '';
        document.getElementById('aiModel').value = cfg.model || '';
        document.getElementById('aiApiUrl').value = cfg.apiUrl || '';
        document.getElementById('aiApiKey').value = cfg.keyConfigured ? '••••••' : '';
        toggleAIForm();
      } catch (err) {
        console.error('加载AI配置失败:', err);
      }
    }

    function toggleAIForm() {
      const checked = document.getElementById('aiEnabled').checked;
      document.getElementById('aiFormFields').style.display = checked ? 'block' : 'none';
    }

    async function saveAISettings() {
      const enabled = document.getElementById('aiEnabled').checked;
      const provider = document.getElementById('aiProvider').value.trim();
      const model = document.getElementById('aiModel').value.trim();
      const apiUrl = document.getElementById('aiApiUrl').value.trim();
      const apiKey = document.getElementById('aiApiKey').value;
      const resultEl = document.getElementById('aiSaveResult');

      if (enabled) {
        if (!apiUrl) return alert('请填写 API 地址');
        if (!apiKey || apiKey === '••••••') {
          // 保留原 key
        }
        if (!model) return alert('请填写模型名称');
      }

      try {
        const res = await fetch('/api/admin/ai-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled, provider, model, apiUrl, apiKey }),
        });
        const data = await res.json();
        if (data.success) {
          resultEl.textContent = '✅ AI 配置已保存并' + (data.active ? '启用' : '更新') + '！';
          resultEl.style.color = '#22c55e';
          if (apiKey && apiKey !== '••••••') {
            document.getElementById('aiApiKey').value = '••••••';
          }
        } else {
          resultEl.textContent = '❌ 保存失败：' + (data.error || '未知错误');
          resultEl.style.color = '#ef4444';
        }
      } catch (err) {
        resultEl.textContent = '❌ 请求失败：' + err.message;
        resultEl.style.color = '#ef4444';
      }
    }

    function changePassword() {
      const oldPwd = document.getElementById('oldPassword').value;
      const newPwd = document.getElementById('newPassword').value;
      if (!oldPwd || !newPwd) return alert('请填写原密码和新密码');

      fetch('/api/admin/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd }),
      })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            alert('密码修改成功！');
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
          } else {
            alert('修改失败：' + (data.error || '未知错误'));
          }
        });
    }

    // ===== 工具函数 =====
    function formatTime(t) {
      if (!t) return '';
      const d = new Date(t);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) + ' ' +
             d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function escHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 输入框自动调整高度
    document.getElementById('adminInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });
  </script>
</body>
</html>
