version: '3.8'

services:
  chat:
    # 使用 GitHub Container Registry 镜像（推荐）
    image: ghcr.io/ry-zzcn/customer-chat:latest
    # 如需本地构建，注释掉上面 image，取消下面 build 注释
    # build: .
    container_name: customer-chat
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => {process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
